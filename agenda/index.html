<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkPulse 2026 — Workspace Agenda</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <div class="app-layout">
    
    <!-- Header Principal -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div>
          <h1>WorkPulse <span class="badge-year">2026 v2.5</span></h1>
          <p class="subtitle">Plataforma Avanzada de Gestión de Tareas</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-add" id="openModalBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva Tarea
        </button>
        <label class="btn btn-glass">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Importar JSON
          <input type="file" id="fileInput" accept=".json" hidden />
        </label>
        <button class="btn btn-primary" id="exportBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar JSON
        </button>
      </div>
    </header>

    <!-- Métricas KPI -->
    <section class="kpi-section">
      <div class="kpi-card">
        <span class="kpi-label">Total Tareas</span>
        <span class="kpi-value" id="kpiTotal">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Urgentes por Gestionar</span>
        <span class="kpi-value text-urgent" id="kpiUrgent">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">En Proceso</span>
        <span class="kpi-value text-progress" id="kpiProgress">0</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Completadas</span>
        <span class="kpi-value text-completed" id="kpiCompleted">0</span>
      </div>
    </section>

    <!-- Filtros -->
    <section class="control-panel">
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por tarea, categoría..." />
      </div>

      <div class="filters-group">
        <select id="categoryFilter" class="custom-select">
          <option value="todos">Todas las Categorías</option>
        </select>

        <select id="priorityFilter" class="custom-select">
          <option value="todos">Todas las Prioridades</option>
          <option value="urgente importante">Urgente e Importante</option>
          <option value="no urgente no importante">No Urgente, No Importante</option>
        </select>

        <select id="statusFilter" class="custom-select">
          <option value="todos">Todos los Estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="en_proceso">En Proceso</option>
          <option value="completado">Completado</option>
        </select>
      </div>
    </section>

    <!-- Grid de Tarjetas -->
    <main class="grid-container" id="taskGrid"></main>
  </div>

  <!-- Modal para Agregar Tarea -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Crear Nueva Actividad</h2>
        <button class="close-modal" id="closeModalBtn">&times;</button>
      </div>
      <form id="newTaskForm" class="modal-form">
        <div class="form-group">
          <label>Categoría</label>
          <input type="text" id="newCategory" placeholder="Ej. Sandalias, Chef, Software..." required />
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <select id="newPriority" class="custom-select" required>
            <option value="urgente importante">Urgente e Importante</option>
            <option value="no urgente no importante">No Urgente, No Importante</option>
          </select>
        </div>
        <div class="form-group">
          <label>Descripción de la Tarea</label>
          <textarea id="newTaskDescription" placeholder="Escribe el detalle de la actividad..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-glass" id="cancelModalBtn">Cancelar</button>
          <button type="submit" class="btn btn-add">Guardar Tarea</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
