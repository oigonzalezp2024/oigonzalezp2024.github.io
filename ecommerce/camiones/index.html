<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Showroom Comercial - JMC Motors</title>
  <!-- Estilos externos -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <div class="header-content">
      <div class="brand-bar">
        <span class="brand-badge">JMC MOTORS</span>
        <span class="header-tag">Portafolio 2026</span>
      </div>
      <h1>Línea de Vehículos Comerciales</h1>
      <div class="intro-box" id="introContext"></div>
    </div>
  </header>

  <main class="app-container">
    <!-- Grid Adaptativo de Vehículos -->
    <div class="vehicles-grid" id="vehiclesList"></div>
  </main>

  <!-- Modal Adaptativo (Bottom-Sheet / Modal Centrado) -->
  <div class="modal-overlay" id="mobileModal">
    <div class="bottom-sheet">
      <div class="sheet-handle-bar" onclick="closeModal()">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-header">
        <div>
          <h3 id="modalTitle">Nombre</h3>
          <span id="modalPrice" style="color: #EF4444; font-weight: 800; font-size: 0.9rem;"></span>
        </div>
        <button class="btn-close-sheet" onclick="closeModal()" aria-label="Cerrar modal">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sheet-body">
        <div class="tabs-scroll">
          <button class="tab-btn-mobile active" onclick="switchTab(0)">1. Aplicación</button>
          <button class="tab-btn-mobile" onclick="switchTab(1)">2. Motor</button>
          <button class="tab-btn-mobile" onclick="switchTab(2)">3. Chasis</button>
          <button class="tab-btn-mobile" onclick="switchTab(3)">4. Interior</button>
        </div>

        <div class="tab-content-mobile active" id="tab0"></div>
        <div class="tab-content-mobile" id="tab1"></div>
        <div class="tab-content-mobile" id="tab2"></div>
        <div class="tab-content-mobile" id="tab3"></div>
      </div>
    </div>
  </div>

  <script>
    let jmcData = { introduccion_cliente: "", modelos: [] };

    // Cargar datos desde el archivo data.json externo
    fetch('./data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error("Error al cargar el archivo JSON");
        }
        return response.json();
      })
      .then(data => {
        jmcData = data;
        renderShowroom();
      })
      .catch(error => {
        console.error("Error:", error);
      });

    // Renderizado dinámico de los datos
    function renderShowroom() {
      document.getElementById('introContext').innerText = jmcData.introduccion_cliente;

      const vehiclesList = document.getElementById('vehiclesList');
      vehiclesList.innerHTML = '';

      jmcData.modelos.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'vehicle-card';
        card.innerHTML = `
          <div class="card-carousel">
            ${item.fotos.map(f => `<div class="carousel-slide"><img src="${f}" alt="${item.producto}"><span class="swipe-hint">Desliza ➔</span></div>`).join('')}
          </div>
          <div class="card-body">
            <div class="card-header-info">
              <div class="vehicle-title">${item.producto}</div>
              <div class="price-tag">${item.precio_sugerido}</div>
            </div>
            <p class="snippet-text">${item.pilar_1}</p>
            <button class="btn-action" onclick="openModal(${index})">
              Ver Ficha Comercial
            </button>
          </div>
        `;
        vehiclesList.appendChild(card);
      });
    }

    // Lógica Modal / Bottom Sheet
    function openModal(index) {
      const item = jmcData.modelos[index];

      document.getElementById('modalTitle').innerText = item.producto;
      document.getElementById('modalPrice').innerText = item.precio_sugerido;

      document.getElementById('tab0').innerText = item.pilar_1;
      document.getElementById('tab1').innerText = item.pilar_2;
      document.getElementById('tab2').innerText = item.pilar_3;
      document.getElementById('tab3').innerText = item.pilar_4;

      switchTab(0);
      document.getElementById('mobileModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('mobileModal').classList.remove('active');
    }

    function switchTab(tabIndex) {
      const btns = document.querySelectorAll('.tab-btn-mobile');
      const contents = document.querySelectorAll('.tab-content-mobile');

      btns.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIndex);
      });

      contents.forEach((content, idx) => {
        content.classList.toggle('active', idx === tabIndex);
      });
    }

    // Cerrar al hacer clic fuera
    document.getElementById('mobileModal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Cerrar con tecla Escape en PC
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>

</html>
