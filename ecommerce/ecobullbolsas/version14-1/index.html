<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobull Bolsas</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="hero-banner" id="hero-banner">
        <!-- NAVEGACIÓN SUPERIOR -->
        <nav class="navbar">
            <div class="nav-top-bar">
                <div class="logo-container">
                    <a href="#" id="logo-link">
                        <img id="logo-img" class="logo-img" src="" alt="">
                    </a>
                </div>
                <!-- Botón Hamburguesa para Móvil -->
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Menú Enlaces (Desplegable en móvil) -->
            <div class="nav-menu-wrapper" id="nav-menu-wrapper">
                <ul class="nav-links" id="nav-menu"></ul>

                <a href="" id="btn-whatsapp" class="btn-whatsapp-nav" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> <span id="whatsapp-text"></span>
                </a>
            </div>
        </nav>

        <!-- SECCIÓN PRINCIPAL DE TEXTO Y ACCIONES -->
        <div class="hero-content">
            <div class="hero-text-side">
                <p class="tagline" id="tagline-text"></p>
                <h3 class="sub-heading" id="sub-heading-text"></h3>
                <h1 class="main-heading" id="main-heading-text"></h1>

                <div class="cta-buttons">
                    <a href="" id="btn-catalog" class="btn-catalog"></a>
                    <a href="" id="btn-quote" class="btn-quote" target="_blank">
                        <span id="btn-quote-text"></span> <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </div>
            </div>

            <!-- LOGO NEGOCIOS VERDES (DERECHA EN DESKTOP / ABAJO EN MÓVIL) -->
            <div class="badge-right">
                <img id="badge-img" src="" alt="">
            </div>
        </div>
    </header>

    <!-- Script JavaScript -->
    <script src="script.js"></script>
</body>

</html>
