<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma B2B Fast-Track - Dashboard Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
        }

        .kpi-card .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .kpi-card .lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--bg-card);
            color: var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Timeline Styles */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .week-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            position: relative;
            transition: transform 0.2s;
        }

        .week-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-blue);
        }

        .week-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .week-badge {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .week-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .week-focus {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-style: italic;
        }

        .act-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .act-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }

        .act-list li::before {
            content: "➔";
            position: absolute;
            left: 0;
            color: var(--accent-green);
        }

        .hito-box {
            background-color: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--accent-green);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #a7f3d0;
        }

        /* Matrix Styles */
        .matrix-accordion {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .matrix-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .matrix-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
        }

        .matrix-header h3 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .prio-tag {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .prio-critica { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .prio-alta { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
        .prio-media { background: rgba(107, 114, 128, 0.2); color: #e5e7eb; }

        .matrix-body {
            padding: 20px;
            display: none;
            border-top: 1px solid var(--border-color);
        }

        .matrix-body.open {
            display: block;
        }

        .level-block {
            margin-bottom: 15px;
        }

        .level-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .level-desc {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .ind-list {
            font-size: 0.82rem;
            color: var(--text-secondary);
            padding-left: 15px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1 id="app-title">Cronograma B2B Fast-Track</h1>
                <p id="app-subtitle">Cargando información desde data.json...</p>
            </div>
            <div class="kpi-container" id="kpi-container">
                <!-- KPIs injected via JS -->
            </div>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('timeline')">Carril Rápido (Semanas 1-6)</button>
            <button class="tab-btn" onclick="switchTab('matrices')">Matrices de Marco Lógico (7 Módulos)</button>
        </div>

        <!-- TAB 1: TIMELINE -->
        <div id="tab-timeline" class="tab-content active">
            <div class="timeline-grid" id="timeline-container">
                <!-- Timeline injected via JS -->
            </div>
        </div>

        <!-- TAB 2: MATRICES -->
        <div id="tab-matrices" class="tab-content">
            <div class="matrix-accordion" id="matrices-container">
                <!-- Matrices injected via JS -->
            </div>
        </div>

        <footer>
            <p>Óscar Iván González Peña &copy; 2026 - Plan Estratégico de Captación y Facturación B2B</p>
        </footer>
    </div>

    <script>
        let globalData = null;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                globalData = await response.json();
                renderHeader();
                renderTimeline();
                renderMatrices();
            } catch (error) {
                console.error('Error cargando data.json:', error);
                document.getElementById('app-subtitle').innerText = 'Error al cargar data.json';
            }
        }

        function renderHeader() {
            const meta = globalData.meta;
            document.getElementById('app-title').innerText = meta.titulo;
            document.getElementById('app-subtitle').innerText = `${meta.objetivo_principal} | Periodo: ${meta.periodo}`;

            const kpis = [
                { val: meta.ticket_promedio_meta, lbl: 'Ticket Promedio' },
                { val: meta.meta_cierres, lbl: 'Meta de Cierres' },
                { val: '<= 10 días', lbl: 'Ciclo de Venta' }
            ];

            const kpiContainer = document.getElementById('kpi-container');
            kpiContainer.innerHTML = kpis.map(k => `
                <div class="kpi-card">
                    <div class="val">${k.val}</div>
                    <div class="lbl">${k.lbl}</div>
                </div>
            `).join('');
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = globalData.cronograma_fast_track.map(item => `
                <div class="week-card">
                    <div class="week-header">
                        <span class="week-badge">${item.semana}</span>
                    </div>
                    <div class="week-title">${item.fase}</div>
                    <div class="week-focus">"${item.enfoque}"</div>
                    <ul class="act-list">
                        ${item.actividades.map(act => `<li>${act}</li>`).join('')}
                    </ul>
                    <div class="hito-box">
                        <strong>Hito de Facturación:</strong> ${item.hito_facturacion}
                    </div>
                </div>
            `).join('');
        }

        function renderMatrices() {
            const container = document.getElementById('matrices-container');
            container.innerHTML = globalData.matrices.map((m, idx) => {
                const prioClass = m.prioridad.includes('Crítica') ? 'prio-critica' : 
                                 (m.prioridad.includes('Alta') ? 'prio-alta' : 'prio-media');

                return `
                    <div class="matrix-item">
                        <div class="matrix-header" onclick="toggleMatrix(${idx})">
                            <h3>${m.titulo}</h3>
                            <span class="prio-tag ${prioClass}">${m.prioridad}</span>
                        </div>
                        <div class="matrix-body" id="matrix-body-${idx}">
                            ${m.niveles.map(lvl => `
                                <div class="level-block">
                                    <div class="level-title">${lvl.nivel}</div>
                                    <div class="level-desc">${Array.isArray(lvl.resumen) ? lvl.resumen.join('<br>') : lvl.resumen}</div>
                                    <ul class="ind-list">
                                        ${lvl.indicadores.map(ind => `<li>${ind}</li>`).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleMatrix(idx) {
            const body = document.getElementById(`matrix-body-${idx}`);
            body.classList.toggle('open');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'timeline') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-timeline').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-matrices').classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
